<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="/icons/logo.svg" />
    <title></title>
  </head>
  <body>
    <main class="cartao">
      <p class="marca">
        <img src="/icons/logo.svg" alt="" />
        <span>Distraction-Free <span>Tab</span></span>
      </p>
      <h1 id="site"></h1>
      <p id="motivo" class="motivo"></p>

      <section id="atrito">
        <p id="instrucao" class="instrucao"></p>
        <blockquote id="frase"></blockquote>
        <input
          id="digitado"
          type="text"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="ou" class="ou"></p>
        <button id="esperar" type="button" class="secundario"></button>
        <button id="liberar" type="button" class="primario" disabled></button>
      </section>

      <section id="livre" hidden>
        <p id="livre-texto"></p>
        <button id="voltar" type="button" class="primario"></button>
      </section>

      <p id="furos" class="furos"></p>
    </main>
  </body>
</html>
